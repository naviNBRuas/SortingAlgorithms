name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r python/requirements.txt
      - run: cd python && python -m pytest -q
      - run: PYTHONPATH=python python scripts/build_docs.py && git diff --exit-code README.md
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd c && make && ./example && make test
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: cd go && go vet ./... && go test ./... && go run ./cmd
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd rust && cargo test --locked && cargo run --quiet
