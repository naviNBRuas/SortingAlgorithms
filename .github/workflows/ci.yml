name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r python/requirements.txt
      - run: cd python && python -m pytest -q
      - run: PYTHONPATH=python python scripts/build_docs.py && git diff --exit-code README.md
  kernels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python kernels/test_kernels.py
      - run: sudo apt-get install -y golang-go >/dev/null && python kernels/generate.py --check
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd cpp && make test
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: cd java && make test
  machine-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd machine-code && make test
  cobol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y gnucobol
      - run: cd cobol && make test
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd c && make && ./example && make test
  assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y valgrind binutils
      - run: cd assembly && make test && make freestanding
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: cd go && go vet ./... && go test ./... && go run ./cmd
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd rust && cargo test --locked && cargo run --quiet
